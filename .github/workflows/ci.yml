name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # No lockfile and no pins: every run installs the latest release of each dependency.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - name: Quick benchmark + dashboard
        run: dvs run --preset quick --no-open
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.os }}-py${{ matrix.python }}
          path: results/
